# 示例配置：复制为 application.yml 后按本地环境修改。
# 请勿在仓库中提交真实密码、密钥或生产环境地址。
xhzb:
  name: xhzb
  version: 3.9.2
  copyrightYear: 2026
  profile: ./data/upload
  addressEnabled: false
  captchaType: math

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.xhzb: info
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 本地 Redis 密码；无密码时按项目配置要求留空或移除此项。
      password: <SET_LOCAL_REDIS_PASSWORD>
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

token:
  header: Authorization
  # 设置为仅本地使用的随机长密钥。
  secret: <GENERATE_A_LONG_RANDOM_SECRET>
  expireTime: 30

mybatis:
  typeAliasesPackage: com.xhzb.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: default
      display-name: 测试模块
      paths-to-match: '/**'
      packages-to-scan: com.xhzb.web.controller.tool

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
